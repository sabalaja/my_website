<!DOCTYPE html>
<html lang="pl">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description" content="Formularz kontaktowy Julki" />
	<title>Kontakt - Julka</title>
	<link rel="stylesheet" href="styles/style.css" />
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
</head>

<body>
	<header>
		<nav class="navbar">
			<h1 class="logo">Julka</h1>
			<ul class="nav-links">
				<li><a href="index.html">Home</a></li>
				<li><a href="gallery.html">Galeria</a></li>
				<li><a href="contact.html">Kontakt</a></li>
				<li><a href="lab1.html">Ćwiczenia</a></li>
			</ul>
		</nav>
	</header>

	<main>
		<section class="contact">
			<h2>Skontaktuj się ze mną</h2>
			<form id="contact-form" action="https://formspree.io/f/moqgyryr" method="POST" class="contact-form">
				<label for="email">E-mail:</label>
				<input type="email" id="email" name="email" placeholder="Twój e-mail" required>

				<label for="subject">Temat wiadomości:</label>
				<select id="subject" name="subject">
					<option value="inspiracja">Inspiracja fotograficzna</option>
					<option value="wspolpraca">Współpraca</option>
					<option value="inne">Inne</option>
				</select>

				<label for="message">Wiadomość:</label>
				<textarea id="message" name="message" placeholder="Napisz wiadomość..." required></textarea>

				<button type="submit">Wyślij</button>
			</form>
		</section>
	</main>

	<footer>
		<p>&copy; 2025 Julka</p>
	</footer>

	<script src="scripts/script2.js"></script>
</body>

</html>
